name: Build and Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build site
        run: |
          rm -rf dist
          mkdir -p dist
          cp index.html dist/index.html
          cp aboutme.md dist/aboutme.md
          cp fonts-czech.json dist/fonts-czech.json
          if [ -f fonts-czech-local.json ]; then cp fonts-czech-local.json dist/fonts-czech-local.json; fi
          if [ -f fonts-czech-local.js ]; then cp fonts-czech-local.js dist/fonts-czech-local.js; fi
          if [ -d fonts/czech ]; then cp -R fonts dist/fonts; fi
          test -s dist/index.html
          test -s dist/aboutme.md
          test -s dist/fonts-czech.json
          test -s dist/fonts-czech-local.js
          grep -q '</html>' dist/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
